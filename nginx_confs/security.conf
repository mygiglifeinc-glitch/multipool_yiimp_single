# security headers
# (Strict-Transport-Security is only added to sites with a real certificate.)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

# . files
location ~ /\.(?!well-known) {
	deny all;
}

location ~ \.sh {
	return 404;
}

location ~ /\.ht {
	deny all;
}

# YiiMP: only the web front end is public. The framework, application code,
# runtime logs and command line entry points are never served directly;
# the static files in /yaamp/ui/css and /yaamp/ui/js are.
location ^~ /framework/ {
	deny all;
}

location ~ ^/yaamp/(?!ui/(css|js)/[^/]+\.(css|js|gif|png)$) {
	deny all;
}

location ~ ^/(run|runconsole)\.php$ {
	deny all;
}

location ~ ^/(serverconfig|keys)[^/]*\.php$ {
	deny all;
}
